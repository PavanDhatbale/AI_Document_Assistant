spring:
  application:
    name: ai-document-assistant
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # --- Relational Database Configuration (MySQL 8+) ---
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ai_doc_assistant}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      pool-name: AiDocAssistantHikariPool

  # --- JPA & Hibernate Settings (Non-destructive) ---
  jpa:
    hibernate:
      ddl-auto: none # Never use create, create-drop, or update in production
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    open-in-view: false

  # --- Flyway Database Migration ---
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # --- File Upload Multipart Constraints ---
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE_MB:25}MB
      max-request-size: ${MAX_REQUEST_SIZE_MB:30}MB

  # --- Spring AI & Model Configurations ---
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-3.8-flash}
        embedding:
          api-key: ${GEMINI_API_KEY:}
          text:
            options:
              model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        api-key: ${QDRANT_API_KEY:}
        collection-name: ${QDRANT_COLLECTION_NAME:document_embeddings}
        initialize-schema: false

# --- Embedded Web Server ---
server:
  port: ${SERVER_PORT:8080}

# --- Application Domain Configurations ---
app:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  storage:
    upload-dir: ${UPLOAD_STORAGE_DIR:./storage/uploads}
    max-file-size-bytes: ${MAX_FILE_SIZE_BYTES:26214400} # 25 MB default
  rag:
    chunk-size-tokens: ${CHUNK_SIZE_TOKENS:500}
    chunk-overlap-tokens: ${CHUNK_OVERLAP_TOKENS:50}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.65}
    top-k: ${RAG_TOP_K_CHUNKS:4}
    embedding-dimension: 768 # Aligned with gemini-embedding-001 (MRL) and Qdrant vector size
    chat-model: ${GEMINI_CHAT_MODEL:${GEMINI_MODEL:gemini-3.8-flash}}
    temperature: ${RAG_TEMPERATURE:0.2}
    max-output-tokens: ${RAG_MAX_OUTPUT_TOKENS:2048}
    max-message-length: ${RAG_MAX_MESSAGE_LENGTH:4000}
    stale-processing-timeout-minutes: ${STALE_PROCESSING_TIMEOUT_MINUTES:15}
  gemini:
    embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
    embedding-dimension: ${GEMINI_EMBEDDING_DIMENSION:${EMBEDDING_DIMENSION:768}}
    embedding-batch-size: ${EMBEDDING_BATCH_SIZE:32}
  qdrant:
    enabled: ${QDRANT_ENABLED:true}
    use-tls: ${QDRANT_USE_TLS:false}
    operation-timeout-seconds: ${QDRANT_TIMEOUT_SECONDS:30}
    upsert-batch-size: ${QDRANT_UPSERT_BATCH_SIZE:64}
