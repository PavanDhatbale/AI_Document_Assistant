spring:
  datasource:
    url: jdbc:h2:mem:auth_testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.qdrant.autoconfigure.QdrantVectorStoreAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatConnectionAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration

app:
  google:
    client-id: test-google-client-id.apps.googleusercontent.com
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LW1pbmltdW0tMjU2LWJpdHMtZXhhbXBsZQ==
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  storage:
    upload-dir: ./target/test-storage
    max-file-size-bytes: 10485760
  rag:
    chunk-size-tokens: 500
    chunk-overlap-tokens: 50
  qdrant:
    enabled: false
